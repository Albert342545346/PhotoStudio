# PostgreSQL для проекта «Фотостудия» (необязательно: можно использовать свой PostgreSQL).
# Запуск:   docker compose up -d --wait
# Остановка: docker compose down        (данные сохраняются в volume photostudio-data)
services:
  postgres:
    image: postgres:16
    container_name: photostudio-postgres
    environment:
      POSTGRES_DB: photostudio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - photostudio-data:/var/lib/postgresql/data
      # Скрипты выполняются при первом создании базы, строго по имени файла.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d photostudio"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  photostudio-data:
